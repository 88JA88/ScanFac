name: Publier ScanFac

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Appliquer la version de publication
        run: |
          script="$(find . -path '*/scripts/set-version.mjs' -type f -print -quit)"
          node "$script"
          dist_dir="$(cd "$(dirname "$script")/../dist" && pwd)"
          mkdir .pages-build
          cp -R "$dist_dir"/. .pages-build/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./.pages-build
      - id: deployment
        uses: actions/deploy-pages@v4
